name: Deploy to Modal - Production

# Enhanced production deployment workflow with security best practices
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_redeploy:
        description: 'Force redeploy even if no changes'
        required: false
        default: false
        type: boolean
  
  repository_dispatch:
    types: [service-down-alert]
  
  push:
    branches: [main]
    paths:
      - 'modal_app.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-production.yml'

# Concurrency control to prevent simultaneous deployments
concurrency:
  group: 'deploy-modal-${{ github.ref }}'
  cancel-in-progress: true

# Least privilege permissions
permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Validate workflow syntax
        run: |
          # Basic YAML syntax check
          python -c "import yaml; yaml.safe_load(open('.github/workflows/deploy-production.yml'))"
          echo "✅ Workflow syntax validation passed"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    
    env:
      MODAL_USER_NAME: ${{ secrets.MODAL_USER_NAME }}
      MODAL_APP_NAME: ${{ secrets.MODAL_APP_NAME || 'proxy-app' }}
      SUB_PATH: ${{ secrets.SUB_PATH || 'sub' }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '3000' }}
      DEPLOYMENT_ENV: ${{ github.event.inputs.environment || 'production' }}
      
    steps:
      - name: Check Trigger Event
        run: |
          echo "🚀 Workflow triggered by: ${{ github.event_name }}"
          echo "📦 Deployment environment: ${{ env.DEPLOYMENT_ENV }}"
          echo "🔄 Force redeploy: ${{ github.event.inputs.force_redeploy || 'false' }}"
          
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "🚨 Event Type: ${{ github.event.action }}"
            echo "🔧 Service down alert received, starting auto-recovery deployment..."
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "👤 Manual workflow trigger, starting deployment..."
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "📝 Push trigger detected, deploying changes..."
          else
            echo "⏰ Scheduled trigger, starting deployment..."
          fi
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install modal fastapi requests
          echo "✅ Dependencies installed successfully"

      - name: Validate Required Secrets
        run: |
          missing_secrets=()
          
          [[ -z "${{ secrets.MODAL_TOKEN_ID }}" ]] && missing_secrets+=("MODAL_TOKEN_ID")
          [[ -z "${{ secrets.MODAL_TOKEN_SECRET }}" ]] && missing_secrets+=("MODAL_TOKEN_SECRET")
          [[ -z "${{ secrets.MODAL_USER_NAME }}" ]] && missing_secrets+=("MODAL_USER_NAME")
          
          if [[ ${#missing_secrets[@]} -gt 0 ]]; then
            echo "❌ Missing required secrets: ${missing_secrets[*]}"
            exit 1
          fi
          echo "✅ All required secrets are present"

      - name: Authenticate Modal
        run: |
          modal token set --token-id ${{ secrets.MODAL_TOKEN_ID }} --token-secret ${{ secrets.MODAL_TOKEN_SECRET }}
          echo "✅ Modal authentication successful"

      - name: Stop Existing App (for clean deploy)
        run: |
          echo "🛑 Stopping existing app: ${{ env.MODAL_APP_NAME }}"
          modal app stop ${{ env.MODAL_APP_NAME }} || echo "⚠️ No existing app to stop"

      - name: Create or Update Modal Secret
        run: |
          echo "🔐 Creating/updating Modal secrets..."
          
          # Delete existing secret if it exists
          modal secret delete modal-secrets --yes || echo "⚠️ No existing secret to delete"
          
          # Create new secret with comprehensive configuration
          modal secret create modal-secrets \
            UUID='${{ secrets.UUID || 'be16536e-5c3c-44bc-8cb7-b7d0ddc3d951' }}' \
            MODAL_USER_NAME='${{ secrets.MODAL_USER_NAME }}' \
            ARGO_DOMAIN='${{ secrets.ARGO_DOMAIN }}' \
            ARGO_AUTH='${{ secrets.ARGO_AUTH }}' \
            ARGO_PORT='${{ secrets.ARGO_PORT || '8001' }}' \
            SUB_PATH='${{ secrets.SUB_PATH || 'sub' }}' \
            NAME='${{ secrets.NAME || 'Modal' }}' \
            CFIP='${{ secrets.CFIP || 'www.visa.com.tw' }}' \
            CFPORT='${{ secrets.CFPORT || '443' }}' \
            NEZHA_SERVER='${{ secrets.NEZHA_SERVER }}' \
            NEZHA_KEY='${{ secrets.NEZHA_KEY }}' \
            NEZHA_PORT='${{ secrets.NEZHA_PORT }}' \
            UPLOAD_URL='${{ secrets.UPLOAD_URL }}' \
            PROJECT_URL='${{ secrets.PROJECT_URL }}' \
            BOT_TOKEN='${{ secrets.BOT_TOKEN }}' \
            CHAT_ID='${{ secrets.CHAT_ID }}' \
            DEPLOYMENT_ENV='${{ env.DEPLOYMENT_ENV }}'
          
          echo "✅ Modal secrets created successfully"

      - name: Deploy to Modal
        run: |
          echo "🚀 Deploying to Modal..."
          modal deploy modal_app.py --name ${{ env.MODAL_APP_NAME }}
          echo "✅ Deployment completed"

      - name: Verify Deployment Health
        run: |
          echo "🏥 Checking deployment health..."
          sleep 10  # Wait for app to start
          
          APP_URL="https://${{ env.MODAL_USER_NAME }}--${{ env.MODAL_APP_NAME }}-web_server.modal.run"
          
          # Health check
          if curl -f -s "$APP_URL" > /dev/null; then
            echo "✅ Health check passed - app is responding"
          else
            echo "❌ Health check failed - app may not be responding correctly"
            # Don't fail the workflow, just warn
          fi

      - name: Output Deployment Information
        run: |
          echo "🎉 Deployment successful!"
          echo "=" * 50
          echo "📋 Deployment Summary:"
          echo "  Environment: ${{ env.DEPLOYMENT_ENV }}"
          echo "  App Name: ${{ env.MODAL_APP_NAME }}"
          echo "  User Name: ${{ env.MODAL_USER_NAME }}"
          echo ""
          echo "🔗 URLs:"
          echo "  Project URL: https://${{ env.MODAL_USER_NAME }}--${{ env.MODAL_APP_NAME }}-web_server.modal.run"
          echo "  Subscription URL: https://${{ env.MODAL_USER_NAME }}--${{ env.MODAL_APP_NAME }}-web_server.modal.run/${{ env.SUB_PATH }}"
          echo "=" * 50

      - name: Deployment Notification (Optional)
        if: always()
        run: |
          # Optional: Add notification logic here (Slack, Discord, etc.)
          echo "📢 Deployment workflow completed with status: ${{ job.status }}"